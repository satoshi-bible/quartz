<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ヨハネによる福音書 2章</title>
  <style>
    body {
      font-family: "serif";
      line-height: 1;
      margin: 2em;
    }

    .chapter-number {
      float: left;
      font-size: 3em;
      line-height: 1;
      margin-right: 0.5em;
      margin-bottom: 0.1em;
      font-weight: bold;
    }

    p {
      text-indent: 1em;
      margin-top: 0;
    }

    sup {
      font-size: 0.7em;
      vertical-align: super;
      margin-right: 0.2em;
    }

    .clearfix::after {
      content: "";
      display: block;
      clear: both;
    }
  </style>
</head>
<body>

  <div class="clearfix">
    <div class="chapter-number">2</div>
    <p><sup>1</sup> その三日目に、ガリラヤのカナで婚礼があった。イエスの母がそこにいた。</p>
    <p><sup>2</sup> イエスも弟子たちとともに、その婚礼に招かれた。</p>
    <p><sup>3</sup> ぶどう酒が足りなくなったとき、母はイエスに「ぶどう酒がありません」と言った。</p>
    <p><sup>4</sup> イエスは母に言われた。「婦人よ、わたしの時はまだ来ていません。」</p>
  </div>

</body>
</html>
