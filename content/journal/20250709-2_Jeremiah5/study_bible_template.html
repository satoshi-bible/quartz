<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>【書名】 【章】章</title>
  <style>
    body {
      font-family: "Noto Serif JP", "Noto Sans JP", serif;
      margin: 2em;
      background-color: #fdfdfc;
    }

    h1 {
        font-size: 2em;
        text-align: center;
        margin-bottom: 1.5em;
        font-weight: bold;
    }

    .container {
      display: flex;
      gap: 1.5em; /* 本文と参照欄の間のスペース */
      margin-bottom: 1em;
    }

    .main-text {
      flex: 3; /* 本文(左)と参照(右)の幅の比率を3:1に設定 */
    }

    .chapter-number {
      float: left;
      font-size: 5em;
      line-height: 0.9;
      margin-right: 0.2em;
      margin-top: 0.1em;
      font-weight: bold;
      color: #888;
    }

    p.bible-text {
      text-indent: 1em;
      line-height: 1.6; /* 段落の行間を読みやすく調整 */
      margin-top: 0;
      margin-bottom: 0.5em;
    }

    sup.verse-num {
      font-size: 0.7em;
      vertical-align: super;
      font-weight: bold;
      margin-right: 0.2em;
    }

    .clearfix::after {
      content: "";
      display: block;
      clear: both;
    }

    .references {
      flex: 1; /* 本文(左)と参照(右)の幅の比率を3:1に設定 */
      border-left: 1px solid #ddd; /* 左側の縦線 */
      padding-left: 1.5em; /* 縦線と参照テキストの間の余白 */
      font-size: 0.9em;
    }
    .references p {
        margin-bottom: 0.8em;
    }
    .references sup {
        font-weight: bold;
    }

    .separator {
      border: 0;
      border-top: 1px solid #ccc;
      margin: 2em 0; /* 上下の余白 */
    }

    .commentary-section h2 {
      font-size: 1.5em;
      font-weight: bold;
      border-bottom: 2px solid #888;
      padding-bottom: 0.3em;
      margin-bottom: 1em;
    }

    .commentary-container {
      display: flex;
      gap: 2em; /* カラム間のスペース */
    }

    .commentary-column {
      flex: 1; /* 均等な2段組 */
    }

    /* 注解の段落スタイル */
    .commentary-column p {
      text-indent: 0; /* 注解ではインデントなし */
      margin-bottom: 1.2em; /* 注解ごとの間隔 */
      font-size: 0.95em;
      line-height: 1.7;
    }

    .commentary-column p sup {
        font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>【書名】 【章】章</h1>

  <div class="container">
    <div class="main-text clearfix">
      <div class="chapter-number">【章】</div>
      <!-- ここに本文を記述します -->
      <!-- 例: -->
      <!-- <p class="bible-text"><sup class="verse-num">1</sup> 節のテキスト... </p> -->
      <!-- <p class="bible-text"><sup class="verse-num">2</sup> 次の節のテキスト... </p> -->

    </div>
    <div class="references">
      <!-- ここにリファレンスを記述します -->
      <!-- 例: -->
      <!-- <p><sup>1</sup> 参照聖句...</p> -->
      <!-- <p><sup>2</sup> 参照聖句...</p> -->

    </div>
  </div>

  <hr class="separator"/>

  <div class="commentary-section">
    <h2>注解</h2>
    <div class="commentary-container">
      <div class="commentary-column">
        <!-- ここに注解（左の段）を記述します -->
        <!-- 例: -->
        <!-- <p><sup>1</sup> <b>キーワード</b> 注解のテキスト...</p> -->

      </div>
      <div class="commentary-column">
        <!-- ここに注解（右の段）を記述します -->
        <!-- 例: -->
        <!-- <p><sup>5</sup> <b>キーワード</b> 注解のテキスト...</p> -->

      </div>
    </div>
  </div>

  <hr class="separator"/>

</body>
</html>
