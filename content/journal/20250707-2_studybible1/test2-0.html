<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>スタディーバイブル・フォーマット</title>
    <style>
        /* CSS変数を定義して、後から簡単に変更できるようにします */
        :root {
            --header-height: 2em; /* ヘッダーの高さ */
            --footer-height: 2em; /* フッターの高さ */
            --border-thickness: 1px; /* 線の太さ */
            --border-style: solid;   /* 線の種類 (solid, dashed, dottedなど) */
            --border-color: #333;    /* 線の色 */
        }

        body {
            margin: 0;
            font-family: "Noto Serif JP", "Noto Sans JP", serif;
        }

        /* ヘッダーとフッターの共通スタイル */
        .page-header, .page-footer {
            /* 画面表示では非表示にし、印刷時のみ表示します */
            display: none;
        }

        /* 印刷時のみ適用されるスタイル */
        @media print {
            /* ページの余白をリセット */
            @page {
                margin: 10mm 10mm 10mm 15mm;
                counter-increment: page;
            }

            body {
                /* ヘッダーとフッターの領域を本文が確保するようにパディングを設定 */
                padding-top: var(--header-height);
                padding-bottom: var(--footer-height);
            }

            .page-header, .page-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: fixed;
                width: 100%;
                box-sizing: border-box;
                padding: 0 1em;
                background: white; /* 本文と重なった場合に背景を白にする */
                left: 0;
            }

            .page-header {
                top: 0;
                height: var(--header-height);
                border-bottom: var(--border-thickness) var(--border-style) var(--border-color);
                align-items: flex-end; /* テキストを線に近づける */
                padding-bottom: 0.5em;
            }

            .page-footer {
                bottom: 0;
                height: var(--footer-height);
                border-top: var(--border-thickness) var(--border-style) var(--border-color);
                align-items: flex-start; /* テキストを線に近づける */
                padding-top: 0.5em;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="page-header">
        <span>ヨハネの福音書 1:43–51<br>test</span>
        <span>Page 1</span>
    </header>

    <!-- 本文 -->
    <main style="padding: 0 2em;">
        <h1>This is a heading</h1>
        <p>This is a paragraph.</p>
        <p>この部分は聖書本文や注解が入るエリアです。印刷プレビューで確認すると、各ページにヘッダーとフッターが固定で表示されるのがわかります。</p>
        <p style="height: 150vh;">（ページの長さを擬似的に伸ばして、複数ページになることを確認するための要素です）</p>
        <p>2ページ目のコンテンツです。</p>
    </main>

    <!-- フッター -->
    <footer class="page-footer">
        <span>study bible (test ver.)</span>
        <span></span>

    </footer>

</body>
</html>
