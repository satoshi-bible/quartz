<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>スタディーバイブル・Paged.js版</title>
    <style>
        @page {
            size: A4;
            margin: 10mm 10mm 10mm 15mm;

            @top-left {
                content: "ヨハネの福音書 1:43–51";
                font-size: 10pt;
                color: #666;
            }

            @top-right {
                content: counter(page);
                font-size: 10pt;
                color: #333;
            }

            @bottom-left {
                content: "study bible (test ver.)";
                font-size: 10pt;
                color: #999;
            }
        }

        body {
            font-family: "Noto Serif JP", "Noto Sans JP", serif;
            margin: 0;
            padding: 0;
        }

        main {
            padding: 0 2em;
        }

        h1 {
            margin-top: 0;
        }
    </style>
</head>
<body>

<main>
    <h1>これは見出しです</h1>
    <p>これは段落です。Paged.jsを使って各ページのヘッダーとフッターにページ番号を含めて表示しています。</p>
    <p>この部分は聖書本文や注解が入るエリアです。印刷プレビューで確認すると、各ページに自動でページ番号や書名などが表示されます。</p>
    <p style="height: 150vh;">（高さを無理に伸ばして複数ページになることを確認するための要素です）</p>
    <p>これは2ページ目以降に表示される文章です。</p>
</main>

<!-- Paged.js の読み込み（CDN経由） -->
<script src="https://unpkg.com/pagedjs/dist/paged.polyfill.js"></script>

</body>
</html>
