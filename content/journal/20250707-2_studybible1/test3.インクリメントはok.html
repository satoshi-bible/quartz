<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Japanese Study Bible</title>
    <style>
        :root {
            --header-height: 3em;
            --footer-height: 3em;
            --border-thickness: 1px;
            --border-style: solid;
            --border-color: #333;
        }

        body {
            margin: 0;
            font-family: "Hiragino Mincho ProN", "MS PMincho", serif;
            counter-reset: page 1; /* カウンターを初期化 */
        }

        .page-header, .page-footer {
            display: none; /* 画面表示では非表示 */
        }

        @media print {
            @page {
                margin: 10mm 10mm 10mm 15mm;
                counter-increment: page; /* 各ページでインクリメント */
            }
            @bottom-left {
                content: "Page " counter(page); /* ページ番号を直接表示 */
                font-family: "Noto Serif JP", "Noto Sans JP", serif;
                font-size: 12pt;
                padding-top: 0.5em;
                border-top: var(--border-thickness) var(--border-style) var(--border-color);
            }
            @bottom-right {
                content: "study bible (test ver.)"; /* フッターの右側コンテンツ */
                font-family: "Noto Serif JP", "Noto Sans JP", serif;
                font-size: 12pt;
                padding-top: 0.5em;
                text-align: right;
            }


            body {
                padding-top: var(--header-height);
                padding-bottom: var(--footer-height);
            }

            .page-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                position: fixed;
                width: 100%;
                box-sizing: border-box;
                padding: 0 1em;
                background: white;
                top: 0;
                height: var(--header-height);
                border-bottom: var(--border-thickness) var(--border-style) var(--border-color);
                align-items: flex-end;
                padding-bottom: 0.5em;
            }

            /* HTMLのフッターは非表示 */
            .page-footer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="page-header">
        <span>ヨハネの福音書 1:43–51<br>test</span>
        <span></span>
    </header>

    <main style="padding: 0 2em;">
        <h1>This is a heading</h1>
        <p>This is a paragraph.</p>
        <p>この部分は聖書本文や注解が入るエリアです。印刷プレビューで確認すると、各ページにヘッダーとフッターが固定で表示されるのがわかります。</p>
        <p style="height: 150vh;">（ページの長さを擬似的に伸ばして、複数ページになることを確認するための要素です）</p>
        <p>2ページ目のコンテンツです。</p>
    </main>

    <footer class="page-footer">
        <!-- 印刷では非表示のため、空でも問題なし -->
    </footer>
</body>
</html>
