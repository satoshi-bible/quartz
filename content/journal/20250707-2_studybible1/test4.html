<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>スタディーバイブル・Paged.js</title>
    <style>
        @page {
            size: A4;
            margin: 20mm;
            
            @bottom-left {
                content: "Page " counter(page) " of " counter(pages);
                font-size: 10pt;
                color: #333;
            }

            @top-right {
                content: "ヨハネの福音書 1:43–51";
                font-size: 10pt;
                color: #666;
            }
        }

        body {
            font-family: "Noto Serif JP", serif;
            margin: 0;
            padding: 0;
        }

        main {
            padding: 0 1em;
        }
    </style>
</head>
<body>

<main>
    <h1>スタディーバイブル本文</h1>
    <p>このページは、Paged.js を使ってページ番号付きPDFを生成するテストです。</p>
    <!-- 長めの本文で複数ページになるようにする -->
    <p style="height: 150vh;">（高さを無理に伸ばしてページを分けています）</p>
    <p>2ページ目のテキストです。</p>
</main>

<!-- Paged.js の読み込み -->
<script src="https://unpkg.com/pagedjs/dist/paged.polyfill.js"></script>

</body>
</html>
